# ============================================================================
# 七、护栏（渲染器与服务层共同执行）
# ============================================================================
护栏:
  连接:
    - 只读打开（mode=ro），任何写操作在连接层就被拒绝
  语句:
    - 只允许单条 SELECT；出现分号（多语句）、或含写/DDL 关键字一律拒绝
    - 拒绝关键字: [INSERT, UPDATE, DELETE, DROP, ALTER, CREATE, ATTACH, DETACH, PRAGMA, VACUUM, REPLACE]
  口径:
    - 比率类指标分母一律 NULLIF；分母为 0 → NULL
    - 比率类指标禁止 AVG(行比率)；只能 SUM(分子)/SUM(分母)
    - 库存类指标必须按物料 SUM 后再比较（聚合后过滤走 HAVING）
    - 时间一律来自时间表达式映射，**不接受模型自算日期**
  结果:
    - 结果行数上限 200（超出提示收窄条件，不静默截断）
    - 空结果必须区分「条件无匹配」与「实体不存在」，措辞不同
  呈现:
    - 答案必须随附口径说明（用了哪个指标定义、哪个时间区间、哪个维度）
    - 阈值类结论（如「不良率超过 5%」）必须把阈值写出来
    - "**请求了「月份」维度且未指定排序时，默认按月份升序**。
      理由（实测）：问「东莞精诚近6个月不良率趋势」时，模型没给排序槽位，
      于是落回指标的默认排序（按度量降序）→ 返回 2026-09 / 2026-08 / 2026-07 /
      2026-04 / 2026-06 / 2026-05 —— 一条**乱序**的时间序列，趋势读不出来。
      时间序列的天然顺序就是时间。问句明确要排名时，排序槽位优先。"

# ============================================================================
# 八、待业务确认（业务决策，不是技术决策 —— 不许自己拍）
# ============================================================================
待确认:
  - 供应商综合评分的权重怎么定？（不要自己拍，必须客户确认）
  - 「按期完工」的容差是多少天？超期 1 天算不算延期？
  - 不良率的分母是抽检数还是到料总数？两者口径差异很大（v1.0 用抽检数）
  - 「近 N 个月」是含当期不完整月，还是只算最近 N 个完整月？
  - 「主要供应商」按采购金额、供货数量、还是最近一次供货？（v1.0 用采购金额）
  - 「在制」工单是否计入达成率分母？（v1.0 计入）
  - "**「五金件」到底指物料类别还是供应商类别？** —— 两个字段取值高度重合
    （12 个物料类别里 11 个与供应商类别同名），「五金件的不良率」在字面上有两解。
    **包 3 已改判**：不再硬澄清，而是**默认按物料类别理解 + 同时把另解明说出来**
    （见 九、拒答与澄清 · 歧义来源）。硬澄清会把一个九成情况下能答的问题
    变成答不出 —— 那是另一种形式的错误。客户若确认固定口径，可把默认改为甲方。"

# ============================================================================
# 九、拒答与澄清（包 3）
# ----------------------------------------------------------------------------
# 为什么这一节必须存在，而且必须**先于模型**执行（有实测依据）：
#   包 0 摸底时 D 档 5/5 会反问 —— 但那是**问句明显模糊**的场景。
#   「上个月员工工资总额是多少」这类**主题越界**的问句，模型不会说「我不知道」，
#   它会拿一张真实表硬答（把「订单金额」当工资报出来）：SQL 合法、数字来自真实数据、
#   格式漂亮，**只有主题是错的**，而且无从对照检查 —— 比口径错更隐蔽。
#   → 主题越界只能由确定性检查拦在前面。
#
# 四类处置（判据全部确定性，可单测；顺序即优先级）：
#   元问题      问「数据本身」（准不准 / 多新 / 覆盖什么）→ 查元信息直接答，不必调模型
#   拒答·超范围  问的对象本库没有（人力 / 销售客户 / 财务 / 设备 / 售后）→ 明说没有 + 给出路
#   澄清·有歧义  问句里的词在库里能被两处解释（五金件 = 物料类别 还是 供应商类别）
#   澄清·缺信息  能答但条件不全（指代不明 / 没点名对象）→ 交给模型反问
# ============================================================================
拒答与澄清:

  原则:
    - "**拒答必须给出路。** 只说「答不了」，用户的下一步动作是随机换一种问法，
      而系统永远不会答 —— 与「功能不存在」没区别。拒答一定要附「本库能答什么」。"
    - "**宁可多一句提醒，不可少答一次。** 库外词与库内词同时命中时**不拒答**，
      走正常链路 + 强提示。把能答的问题变成答不出，是另一种错误，且用户无从察觉。"
    - 拒答判据只认**关键词命中**，不做语义猜测 —— 猜错的方向无法被用户纠正。

  # -------------------------------------------------------------- 范围边界
  范围:
    覆盖: [供应商, 物料, 采购订单, 到料检验, 库存, 生产工单]
    一句话: 本库是「供应链 + 生产」数据，回答的是采购、到料质量、库存、工单这四件事。
    可答示例:
      - 各供应商的来料不良率 / 准时交付率
      - 低于安全库存的物料有哪些
      - 各物料类别的生产工单达成率
      - 各供应商的采购金额排名
      - 一共有多少家供应商 / 多少个物料
    # ⚠️ 库内关键词是**防误伤**的：问句里只要出现其中任何一个，就认为问的是本库范围，
    #    不再走拒答（哪怕同时命中了库外词）。实测场景：「客户让我们查东莞精诚的不良率」
    #    —— 含「客户」，但主体是供应商质量，必须照答。
    #    词表刻意**短而准**：宁可有漏网（漏了就交给模型 + 提示），不可乱拦。
    库内关键词:
      - 供应商, 厂商, 供货商, 厂家, 供方, 卖家
      - 物料, 零件, 部件, 料号, 品号, 货品, 材料
      - 采购, 订单, 下单, 到料, 来料, 进货, 入库, 收货
      - 检验, 质检, 抽检, 不良, 合格, 判定, 质量
      - 库存, 仓库, 仓位, 库房, 缺料, 水位, 安全库存
      - 生产, 工单, 计划, 完工, 在制, 达成
      - 金额, 数量, 价格, 排名, 趋势, 分布
    # 库外主题：命中的词 + 该词所属主题 + 为什么答不了
    不支持:
      - 主题: 人力
        词: [员工, 职工, 考勤, 出勤, 工资, 薪资, 薪酬, 人事, 招聘, 离职, 加班, 社保, 绩效]
        说明: 本库没有人事相关表（6 张表全是供应链与生产数据）
      - 主题: 销售与客户
        词: [客户, 顾客, 销售, 销售订单, 营业额, 营收, 回款, 应收账款, 合同, 报价, 中标]
        说明: 本库的「订单」指**我方向供应商下的采购订单**，不是销售订单；也没有客户表
      - 主题: 财务
        词: [利润, 毛利, 成本, 净利, 财务, 税, 折旧, 预算, 费用, 报销, 资产,
             报损, 损耗, 报废, 盘亏, 盘盈]
        说明: 本库只有「采购订单.订单金额」（不含运费、税、人工），不能当成本或利润用；
             库存表只有数量、没有金额，也没有报损/盘点的记录
        # ⚠️ 刻意**不收**「报表」：任何一条链路都能「导一份报表」，
        #    把它当财务词会把「帮我导一份报表」拦成拒答（实测 T56）。
        #    「财务报表」仍会命中「财务」，该拒的照样拒。
      - 主题: 设备
        词: [设备, 机器, 产线, 停机, 故障, 维修, 保养, 点检, 稼动率, 备件]
        说明: 本库没有设备台账与停机记录
      - 主题: 售后
        词: [退货, 售后, 投诉, 客诉, 索赔, 三包, 返修, 满意度]
        说明: 本库没有售后/退换货记录（「检验判定」只有合格与不合格两种）
      - 主题: 物流
        词: [物流, 运输, 配送, 快递, 承运, 装车, 到货城市, 收货地址]
        说明: 本库只记「到料」这一件事（到料日期/到料检验），没有发货、运输、承运商与收货地址
        # ⚠️ 刻意**不收**「送货 / 发货」：口语里「谁家送货最守时」问的就是准时交付率
        #    （实测 T46 被这层拦成拒答）。物流主题只收**库里确实没有的那件事**。
      - 主题: 资质与账期
        词: [信用评级, 资质, 证书, 认证, 营业执照, 开户行, 银行账号, 税号, 账期,
             付款条件, 结算方式, 联系人, 联系电话]
        说明: 本库的供应商表只有名称/类别/评级/准入状态，没有资质、证照与账期结算信息
      - 主题: 其他
        词: [天气, 汇率, 股票, 政策, 新闻, 竞品, 市场行情]
        说明: 本库是内部经营数据，不含外部信息

    # ---------------------------------------------------------- 不支持问项
    # 🔴 与「不支持主题」的区别（这一层是 2026-10-17 补的，起因是一个真实失败）：
    #    主题 = **数据范围**，顺口提到不等于要它 ——「客户让我们查东莞精诚的不良率」
    #           命中了「客户」，但它问的是供应商质量，必须照答（纪律 ②）。
    #    问项 = **用户明确要的那个东西本身**（退货率 / 信用评级 / 运到哪些城市）。
    #           它一出现就说明「要的东西本库没有」，**不再看库内词是否命中** ——
    #           因为「各供应商的退货率」里命中的「供应商」只是维度，证明不了有退货这回事。
    #    实测（分布外题集 2026-10-17）：O05「各供应商的退货率是多少？」原来命中「退货」
    #    （售后主题）+「供应商」（库内词）⇒ 按纪律 ② 放行 ⇒ 模型给了澄清；
    #    O06「信用评级」连库外词都没命中 ⇒ 直接放行。两条都是「答不出的问题被当成了答得出的」。
    #
    # ⚠️ **只收完整词，不收裸的短词**：「信用评级」可以收，「评级」不能收 ——
    #    库里有「供应商评级」这个枚举字段，「评级」会把能答的问句一并拦掉
    #    （反向包含，与「供应商评级被吞成供应商」同源）。
    不支持问项:
      - 词: [退货率, 退货数量, 退货金额, 退货批次, 退货记录,
             退了, 退掉, 退回, 退换]
        说明: 本库没有退换货数据（「检验判定」只有合格与不合格两种），也不执行退货操作
      - 词: [客诉率, 投诉率, 投诉数量, 满意度]
        说明: 本库没有客户投诉与满意度记录
      - 词: [库存周转率, 周转天数, 库龄]
        说明: 本库库存表只有数量与更新时间，没有出入库流水，算不出周转
      - 词: [毛利率, 净利率, 利润率, 成本合计, 人工成本]
        说明: 本库只有「采购订单.订单金额」（不含运费、税、人工），不能当成本或利润用
      - 词: [信用评级, 信用等级, 账期, 付款条件, 结算方式]
        说明: 本库供应商表只有名称/类别/评级/准入状态，没有信用与账期信息
      - 词: [城市, 收货地址, 发货地址, 运费, 物流费, 承运商]
        说明: 本库没有发货与运输记录，也没有地址字段

  # -------------------------------------------------------------- 模糊问项
  # 🔴 为什么这一层必须存在（2026-10-17 实测，60 题 D 档「真实日志」T34/T57）：
  #    「那家供应商还行吗」「哪家供应商有风险？」—— 模型都**没有犹豫**，
  #    直接按「不良率最高」给了 SQL。它答的不是用户问的问题，而是**自己挑了一个**
  #    指标去答。这比「答不出」更危险：结果看起来像模像样，用户不会起疑。
  #
  # 与「口语映射」的分界（本节的关键线）：
  #    口语映射仍有明确方向 ——「精诚的货质量怎么样」= 质量 = 来料不良率（T48，该答）。
  #    模糊问项连方向都没有 ——「有风险」可能是不良率高、交付差、库存低，
  #    挑哪个都是替用户做决定，而用户可能根本不关心那个。
  #    因此判据是两条**并列**（指向不明 / 标准不明），且都要过三道护栏（见下）。
  模糊问项:
    指代词: [那家, 这家, 该家, 那个, 这个, 那批, 这批, 那几, 这几, 上述, 他们, 她们]
    # 「这个月怎么样」里的「这个」不是指代实体，是时间指示 —— 后面跟时间量词时不算指代。
    # 不排除的话 T31 会被记成「指向不明」，而它真正的问题是「标准不明」（怎么样）。
    指代排除后缀: [月, 季, 周, 天, 年, 日, 号]
    # 评价词 = 「没说要按什么标准评价」的标记。
    # ⚠️ 刻意**不收**「质量」「交期」这类方向词：它们是口径名，属于口语映射的活。
    评价词: [有风险, 有没有风险, 风险大, 风险高, 还行吗, 行不行, 好不好, 怎么样,
             如何, 靠谱, 靠不靠谱, 表现如何, 表现怎么样]
    # 护栏（任一成立 → 不判模糊）：
    #   ① 有分组信号（各 / 分别 / 分组）—— 问的是分布（「各供应商的情况怎么样」），不是评价
    #   ② 有实体值 —— 对象已经给了（「精诚的货质量怎么样」），剩下的交给口语映射
    # 另有「有指标名」，但它**只约束评价分支**（方向给了就不算标准不明）；
    # 指代分支不看它 ——「那家的不良率是多少」方向清楚、对象不清，照样要澄清。
    # 判据宁松勿紧：漏拦只是退回今天的行为（硬答）；误拦会把该答的题变成答不出。
    指代措辞: |
      你说的「%s」我这边对不上具体是哪一条 —— %s，只凭指代词定不下来。

      补一个名字就行，例如：
      · 东莞精诚最近半年的来料不良率
      · 原料仓现在低于安全库存的物料有哪些
    # 评价措辞是**定向**的：把「可能指什么」摆出来让用户挑，而不是让他自己猜
    # （与「反问兜底」同理，理由见该节注释）。
    评价措辞: |
      「%s」在本库没有定义 —— 它可能是质量问题（来料不良率）、交期问题（准时交付率）、
      库存问题（低于安全库存），也可能是工单问题（计划达成率）。这几个口径的分母完全不同，
      替你挑一个，答的就是另一个问题。

      你更关心哪一个？例如：
      · 各供应商的来料不良率排名（质量）
      · 各供应商的准时交付率排名（交期）
      · 低于安全库存的物料（库存）

  # -------------------------------------------------------------- 时间边界
  # 🔴 为什么这一层必须存在（2026-10-17 实测，分布外题集 O08/O09）：
  #    「2025 年全年的不良率走势如何？」—— 模型**没有**任何动摇，直接按全区间画了
  #    一张 2026-04~09 的月度趋势，标题写着 2025。数字全部来自真实数据，只有年份是错的，
  #    而且看不出错。「下个月的采购金额预计是多少？」同样：给了 SQL，等于把「没发生的事」
  #    用历史数据算出来当答案。
  #    这两类在措辞上是**字面可判**的（年份 / 月份 / 未来词），而且判在模型前面最便宜。
  #
  # 判据只认**零交集**：区间与数据跨度有任何重叠就放行 ——
  #    「今年」= 2026-01-01~2027-01-01，与 2026-04~09 有重叠，照答（前三个月缺数，
  #    但那是「部分没有」，不是「完全没有」，该由答案里的时间范围说明，不该拒答）。
  时间边界:
    未来词: [下个月, 下个季度, 下季度, 明年, 后年, 未来, 预测, 预计, 预估, 展望]
    措辞: |
      这个问题的时间范围在**本库数据之外**。

      本库的数据范围是 **%s ~ %s**（共 %s），你问的 **%s** 完全落在这个范围之外。

      本库能答的是这个区间里已经发生的事 —— 质量（来料不良率）、交期（准时交付率）、
      库存（低于安全库存的物料）、工单（生产计划达成率）、采购（金额排名）。
      想看趋势的话，可以把时间换成「近6个月」或「上月」。
    未来措辞: |
      本库只有**已经发生**的数据（%s ~ %s），没有预测或计划数据，所以「%s」这类问题答不了。

      能答的是这个区间里的事：质量（来料不良率）、交期（准时交付率）、
      库存（低于安全库存的物料）、工单（生产计划达成率）、采购（金额排名）。


  # 「问数据本身」的问题。这类问题**不需要问模型** —— 答案就在定义文件与库里，
  # 模型答反而危险：它会用「应该没问题」「数据是最新的」这种无根据的保证来糊弄。
  元问题:
    # 短语命中 = **必要不充分**条件（还有两道护栏：含指标名 / 含分组信号 → 不判元问题）。
    # 2026-10-17 补：能力问询（「你都能查些什么」）原来一条都不命中 → 走模型 → 模型给了澄清。
    # 这类问题答案本来就在定义文件里，不该花 GPU，也不该让模型去编。
    短语: [准不准, 准吗, 准确吗, 靠谱吗, 可靠吗, 可信吗, 数据来源, 数据从哪,
           数据从哪来, 哪来的数据, 更新到, 更新到什么时候, 什么时候的数据,
           数据多新, 数据覆盖, 覆盖了哪些, 多少条数据, 多少条记录, 几条数据,
           几张表, 有几个表, 这个库有什么, 这库有什么, 能问什么, 可以问什么,
           怎么用, 演示数据还是, 是真实数据吗, 是不是真实数据, 脱敏,
           # ---- 能力问询（2026-10-17）----
           都能查, 能查什么, 能查些什么, 查些什么, 支持哪些, 有哪些功能,
           能做什么, 会做什么, 你有什么用, 怎么收费, 收费标准]
    # 通用问题：与**本库数据无关**的问题（今天几号 / 你是谁 / 天气）。
    # 处理方式与元问题相同（查定义、不调模型），但**答案不同** —— 不能拿「数据来源」
    # 那套去回答「今天是星期几」，那是答非所问。措辞必须明说「我只读本库数据」。
    通用问题:
      短语: [今天是星期几, 今天星期几, 今天是几号, 今天几号, 现在几点, 现在时间,
             你叫什么, 你是谁, 你是哪个模型]
      措辞: |
        这个我答不了 —— 我只读**本库**（供应链 + 生产）的数据，不查日期、天气、新闻这类通用信息。
        本库数据的时间范围是 %s（相对时间的锚点是 %s）。
        要问数据的话：%s
    # 诚实边界见下 —— 这条对「通用问题」同样适用：**不许编**。
    # 🔴 反面教材（真实存在）：模型被问「今天是星期几」时会给一个**像模像样的日期**，
    #    而它并不知道今天是几号。宁可直接说「我不查这个」，也不许猜。
    诚实边界:
      - 本库是**演示库**（固定随机种子生成），不是生产数据 —— 必须明说是演示数据，
        **不许**用「数据准确可靠」这类话糊弄。这是本库唯一能被质疑「准不准」的答案。
      - 只报**能核对的**事实：表名、行数、时间跨度、锚点、生成脚本。
      - 不承诺「不会有错」；改为告诉用户**怎么自查**（页面上的 SQL 就是实际执行的那条）。

  # -------------------------------------------------------------- 歧义来源
  # 歧义词表**不手写** —— 运行时取两个字段取值的交集。这样枚举值一变，
  # 歧义词表自动跟着变（手写的第二份清单必然过期，而且过期不报错）。
  歧义来源:
    - 名称: 类别词
      测法: 交集            # 运行时取甲/乙字段取值的交集，**不手写词表**
      甲: {表: 物料, 字段: 物料类别, 表述: 物料类别}
      乙: {表: 供应商, 字段: 供应商类别, 表述: 供应商类别}
      默认: 甲
      默认理由: 「五金件的不良率」口语里指的是**料本身**的质量，不是「供这类货的供应商」的质量；
               且 11/12 的取值同名，若硬澄清会把九成能答的问题变成答不出
      触发条件: 问句出现交集词 **且** 意图里没有显式按乙字段筛这个词
      措辞: 本库「%s」既是一个物料类别，也是一个供应商类别；本次按**%s**理解。
            若你要看的是%s，把话说明白（例如「%s的供应商」）即可。
    - 名称: 达成口径
      测法: 关键词          # 词表语义无法用「交集」表达，用触发词 + 排除词
      触发词: [达成, 完成率]
      排除词: [按期, 准时, 按时, 交期, 数量, 完工, 工单]
      默认表述: 数量达成（完工数 ÷ 计划数）
      另一表述: 按期完工（时间口径）
      默认理由: M4「生产工单达成率」的定义就是数量口径
      触发条件: 含触发词 **且** 不含任何排除词
      措辞: 「达成」在本库默认指**%s**。若你问的是**%s**，那是另一个指标，请写明「按期」
            （或「按时」）——两者的分母完全不同，不能互相替代。

  # -------------------------------------------------------------- 反问兜底
  # 模型给的反问如果只是「请补充更多信息」，用户的下一步是**随机猜一次**，
  # 猜不中就再猜 —— 与不答没有区别。反问要能**收敛**，必须给出可选方向。
  反问兜底:
    触发: 模型反问缺少方向词（长度 < 12 字，或未命中任何方向关键词）
    # 左：用户嘴里的方向词（「、」分隔都算）；右：本库能算的度量词。
    # 🔴 这份表**两个用途**（同源复用，不是重复定义）：① 模型反问时补可选方向；
    #    ② 模型答不出时按方向词补指标（`意图解析.方向兜底`）。
    # 🔴 2026-10-17 补「品质 / 交货 / 缺料 / 生产进度 / 便宜 / 价格 / 费用」：
    #    T48「货质量」只写了「质量」时被反问；T55「又便宜质量又好」原只命中
    #    「质量」一个方向 → 会被方向兜底误判成来料不良率（多方向才该拒绝）。
    #    ⚠️ 不加单字「贵」—— 「贵公司」这种客套会误命中。
    方向: [质量、品质/不良率, 交期、交货、准时、延期/准时率,
          库存、缺料、备货/水位, 工单、生产进度/达成率,
          采购、便宜、价格、费用/金额]
    补语: 你可以从这几类里挑一个：各供应商的**质量**（来料不良率）、
          **交期**（准时交付率）、**库存**（低于安全库存的物料）、
          **工单**（生产计划达成率）、**采购**（金额排名）。

# ============================================================================
# 十、跨指标前置（问句里同时出现两个不同指标 → 直接澄清，不进模型）
# ----------------------------------------------------------------------------
# 为什么这一节由纯规则做（有实测依据，不是洁癖）：
#   40 题盲测 A 类「硬答」里 T25/T26/T30 是跨指标问法。T25「各供应商的不良率和准时
#   交付率分别是多少？」—— 模型把**两个指标都识别出来了**，却渲染成
#   `SELECT COUNT(*) AS 供应商数 FROM 供应商`：宁可答非所问，也不说「我一次只能答一个」。
#   三轮微调（199 条 / 223 条 / 统一澄清格式）实测：硬答**始终是 4 题**，
#   加同族样本、把输出格式写整齐都压不动 —— 这是**输出策略**，不是识别能力。
#   而「两个指标词共现」是**字面可判**的 → 落在本文件既定的
#   「问句 → 前置判定（纯规则）→ 意图解析（模型）」那一层，不必用 GPU 去买。
#
# 与「反问兜底」的分工：反问兜底是**通用**方向清单（模型自己说不清该问什么时兜底）；
# 这里是**定向**候选（已经知道用户提了哪两个指标，就把这两个摆出来让他挑）。
# 两者不可互换：跨指标用通用清单 = 用户还得自己猜该挑哪个（报告第七节 #11 的原话）。
# ============================================================================
跨指标前置:
  阈值: 2          # 命中 ≥2 个**不同**指标即触发；同一指标的名称+别名共现不算
  措辞: |
    你这句话里同时提到了 %s —— 本系统一次只按**一个**指标口径回答：
    两个指标的主表、分母、时间字段往往都不同（不良率看到料日、采购金额看下单日），
    硬凑成一张表会互相污染。

    请选一个，我把这一个算给你：
    %s
  候选: "· 只看「%s」"
