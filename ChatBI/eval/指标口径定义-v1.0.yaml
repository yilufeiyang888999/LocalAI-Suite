# 时间锚点：所有相对时间（上月 / 近6个月 …）都是从锚点日推算出来的
时间锚点:
  采用: 数据截止日
  值: "2026-09-22"
  理由: 演示库的数据在 9-22 断更，锚在真实当日会让「上月」指向数据不完整的 9 月
  备选:
    真实当日:
      值: 取跑批时的系统日期
      何时用: 只有数据持续更新的生产库才用这个
      副作用: 演示库用它会得到「上月 = 2026-09」，而 9 月多数指标不完整，结论不可比
  口径声明: "「本月」= 2026-09（不完整，不建议作演示基准）；「上月」= 2026-08；「近6个月」= 2026-04 ~ 2026-09"

# ============================================================================
# 一、指标定义
# ============================================================================
指标:

  # ------------------------------------------------------------------ M1
  - 编号: M1
    名称: 来料不良率
    # 「货质量」：2026-10-17 实测 T48「精诚的货质量怎么样」—— 别名里只有「来料质量」，
    # 模型认不出「货质量」→ 连 JSON 都不给，直接反问你「请选一个方向」。
    # ⚠️ 只加「货质量」，**不加单字「质量」**：后者是通用评价词，会跟「质量整改通知」
    #    这类**动作请求**、以及 T55「又便宜质量又好」这种**跨指标**问句搅在一起。
    #    A/B 实测：加「货质量」后 T48 正确映射来料不良率，T12/T55 行为不变。
    别名: [不良率, 不合格率, IQC不良率, 来料质量, 来料合格情况, 来料不良, 货质量]
    业务含义: 衡量供应商供货质量水平
    主表: {表: 到料检验, 别名: i}
    度量:
      别名: 不良率
      表达式: "SUM(i.不良数量) * 100.0 / NULLIF(SUM(i.抽检数量), 0)"
      精度: 2
      单位: 百分比
      口径说明: 不良数量合计 ÷ 抽检数量合计（先 SUM 再相除）
    连接:
      供应商: "JOIN 供应商 s ON s.供应商编码 = i.供应商编码"
      物料: "JOIN 物料 m ON m.物料编码 = i.物料编码"
      采购订单: "JOIN 采购订单 p ON p.采购订单号 = i.采购订单号"
    连接顺序: [供应商, 物料, 采购订单]
    维度:
      供应商:
        连接: [供应商]
        选择: "s.供应商名称 AS 供应商"
        分组: "s.供应商名称"
      物料:
        连接: [物料]
        选择: "m.物料编码 AS 物料编码, m.物料名称 AS 物料名称, m.物料类别 AS 物料类别"
        分组: "m.物料编码, m.物料名称, m.物料类别"
      物料类别:
        连接: [物料]
        选择: "m.物料类别 AS 物料类别"
        分组: "m.物料类别"
      供应商类别:
        连接: [供应商]
        选择: "s.供应商类别 AS 供应商类别"
        分组: "s.供应商类别"
      月份:
        连接: []
        选择: "substr(i.到料日期, 1, 7) AS 月份"
        分组: "substr(i.到料日期, 1, 7)"
    # 注：「不良原因分布」「检验判定分布」不是不良率问题（分组的比率恒为 100%），
    #     归入 基础查询.分组聚合，不要在比率指标下开这类维度。
    时间字段: "i.到料日期"
    过滤字段:
      供应商名称: {连接: [供应商], 表达式: "s.供应商名称"}
      供应商编码: {连接: [], 表达式: "i.供应商编码"}
      物料名称: {连接: [物料], 表达式: "m.物料名称"}
      物料编码: {连接: [物料], 表达式: "m.物料编码"}
      物料类别: {连接: [物料], 表达式: "m.物料类别"}
      供应商类别: {连接: [供应商], 表达式: "s.供应商类别"}
      检验判定: {连接: [], 表达式: "i.检验判定"}
      主要不良原因: {连接: [], 表达式: "i.主要不良原因"}
    默认排序: {按: 度量, 方向: 降序}
    护栏:
      - 分母必须走 NULLIF —— 分母为 0 时返回 NULL，**不能返回 0**
        （「没有抽检」被显示成 0% 不良，是最典型的误读）
      - 必须先 SUM 再相除，**禁止 AVG(每行比率)**
        （对行比率求平均会掉进辛普森悖论：大订单和小订单被同等对待）
      - 不良率是对「检验批次」的加权，不是对「物料」或「供应商」等权平均

  # ------------------------------------------------------------------ M2
  - 编号: M2
    名称: 准时交付率
    别名: [准时率, 交期达成率, OTD, 交付及时性, 延期情况, 准时交付]
    业务含义: 衡量供应商按期交货能力
    主表: {表: 采购订单, 别名: p}
    度量:
      别名: 准时率
      表达式: "SUM(CASE WHEN i.到料日期 <= p.约定交期 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)"
      精度: 1
      单位: 百分比
      口径说明: 到料日 ≤ 约定交期的订单数 ÷ 已到料订单数
    连接:
      到料检验: "JOIN 到料检验 i ON i.采购订单号 = p.采购订单号"
      供应商: "JOIN 供应商 s ON s.供应商编码 = p.供应商编码"
      物料: "JOIN 物料 m ON m.物料编码 = p.物料编码"
    连接顺序: [到料检验, 供应商, 物料]
    # 度量表达式引用了 到料检验 的字段 —— 这张表必须无条件 JOIN，
    # 否则「不带维度」的问法（如 B09「宁波恒力的准时率」）会漏表而报 no such column
    必需连接: [到料检验]
    维度:
      供应商:
        连接: [供应商]
        选择: "s.供应商名称 AS 供应商"
        分组: "s.供应商名称"
      物料:
        连接: [物料]
        选择: "m.物料编码 AS 物料编码, m.物料名称 AS 物料名称"
        分组: "m.物料编码, m.物料名称"
      物料类别:
        连接: [物料]
        选择: "m.物料类别 AS 物料类别"
        分组: "m.物料类别"
      月份:
        连接: []
        选择: "substr(p.约定交期, 1, 7) AS 月份"
        分组: "substr(p.约定交期, 1, 7)"
    时间字段: "p.约定交期"
    过滤字段:
      供应商名称: {连接: [供应商], 表达式: "s.供应商名称"}
      供应商编码: {连接: [], 表达式: "p.供应商编码"}
      物料编码: {连接: [物料], 表达式: "m.物料编码"}
      物料类别: {连接: [物料], 表达式: "m.物料类别"}
    默认排序: {按: 度量, 方向: 升序}
    护栏:
      - "**实际到料日期只能从 到料检验.到料日期 取** —— 采购订单表里没有这个字段。
        这是刻意的数据模型陷阱，也是真实 ERP 的常态。"
      - 未到料的订单不进分母（否则会把「还没到货」当成「已经延期」）
      - 本库一单一次到料（585 张已到料订单 = 585 条检验记录，已实证），
        多次到料的口径需业务确认
      - 订单状态在全库只有「已入库」一种（已实证），故无「退货中是否计入」的分歧

  # ------------------------------------------------------------------ M3
  - 编号: M3
    名称: 库存安全水位
    别名: [库存偏低, 缺料风险, 安全库存, 库存预警, 水位]
    业务含义: 识别库存低于安全库存的物料（水位 < 100% 即触发预警）
    主表: {表: 库存, 别名: k}
    度量:
      别名: 水位百分比
      表达式: "SUM(k.库存数量) * 100.0 / m.安全库存"
      精度: 1
      单位: 百分比
      口径说明: 按物料汇总全部仓库后的持有量 ÷ 该物料安全库存
    连接:
      物料: "JOIN 物料 m ON m.物料编码 = k.物料编码"
    连接顺序: [物料]
    # 度量表达式引用了 物料.安全库存 —— 无条件 JOIN
    必需连接: [物料]
    维度:
      物料:
        连接: [物料]
        选择: "m.物料编码 AS 物料编码, m.物料名称 AS 物料名称, m.物料类别 AS 物料类别, ROUND(SUM(k.库存数量), 0) AS 库存合计, m.安全库存 AS 安全库存"
        分组: "m.物料编码, m.物料名称, m.物料类别, m.安全库存"
    # 选择列里额外带出「库存合计」与「安全库存」—— 让答案可被业务人员自己复核
    # （只说 13.6% 没人服气，把 380 vs 2800 摆出来才服气）
    # 注：水位百分比的分母是「该物料的安全库存」，是物料级量。
    #     按类别/仓库分组会让分母失去意义（SQLite 会静默取任意一行的值），
    #     故本指标只开放「物料」维度。「各仓库库存总量」走 基础查询.分组聚合。
    时间字段: "k.更新时间"
    过滤字段:
      物料编码: {连接: [], 表达式: "k.物料编码"}
      物料名称: {连接: [物料], 表达式: "m.物料名称"}
      物料类别: {连接: [物料], 表达式: "m.物料类别"}
      仓库名称: {连接: [], 表达式: "k.仓库名称"}
    默认排序: {按: 度量, 方向: 升序}
    # HAVING 型指标：过滤发生在聚合之后，不能写成 WHERE
    聚合后过滤: "SUM(k.库存数量) < m.安全库存"
    护栏:
      - "**必须先按物料 SUM 全部仓库** —— 同一物料可能分布在多个仓位
        （本库 67 条库存记录挤在 30 个物料上，平均每个物料 2.2 个仓位）。
        直接比单条库存记录会得出 10 个假预警，真预警只有 3 个。"
      - 「安全库存」说的是**全公司持有量**，不是单个仓位 —— 单仓低于它属正常
      - 预警过滤必须走 HAVING（聚合后），写成 WHERE 是逻辑错误

  # ------------------------------------------------------------------ M4
  - 编号: M4
    名称: 生产工单达成率
    别名: [工单达成率, 计划达成情况, 生产完成率, 达成率]
    业务含义: 衡量生产计划执行能力
    主表: {表: 生产工单, 别名: w}
    度量:
      别名: 达成率
      表达式: "SUM(w.完工数量) * 100.0 / NULLIF(SUM(w.计划数量), 0)"
      精度: 1
      单位: 百分比
      口径说明: 完工数量合计 ÷ 计划数量合计
    连接:
      物料: "JOIN 物料 m ON m.物料编码 = w.物料编码"
    连接顺序: [物料]
    维度:
      物料:
        连接: [物料]
        选择: "m.物料编码 AS 物料编码, m.物料名称 AS 物料名称, m.物料类别 AS 物料类别"
        分组: "m.物料编码, m.物料名称, m.物料类别"
      物料类别:
        连接: [物料]
        选择: "m.物料类别 AS 物料类别"
        分组: "m.物料类别"
      工单状态:
        连接: []
        选择: "w.工单状态 AS 工单状态"
        分组: "w.工单状态"
      月份:
        连接: []
        选择: "substr(w.计划完工日, 1, 7) AS 月份"
        分组: "substr(w.计划完工日, 1, 7)"
    时间字段: "w.计划完工日"
    过滤字段:
      物料编码: {连接: [], 表达式: "w.物料编码"}
      物料名称: {连接: [物料], 表达式: "m.物料名称"}
      物料类别: {连接: [物料], 表达式: "m.物料类别"}
      工单状态: {连接: [], 表达式: "w.工单状态"}
    默认排序: {按: 度量, 方向: 升序}
    护栏:
      - 达成率看**数量**（SUM 完工 ÷ SUM 计划）；「按期完工率」看**时间**。
        客户说「达成」时必须先问清是哪个 —— 这是两个不同指标
      - 「在制」工单（本库 12 张）是否计入分母需业务确认；默认计入

  # ------------------------------------------------------------------ M5
  - 编号: M5
    名称: 采购金额
    别名: [采购额, 采购总额, 订单金额, 采购金额合计]
    业务含义: 衡量供应商/物料/品类的采购规模（常与不良率并列看性价比）
    主表: {表: 采购订单, 别名: p}
    度量:
      别名: 采购金额
      表达式: "SUM(p.订单金额)"
      精度: 2
      单位: 元
      口径说明: 订单金额合计（不按到料与否过滤）
    连接:
      供应商: "JOIN 供应商 s ON s.供应商编码 = p.供应商编码"
      物料: "JOIN 物料 m ON m.物料编码 = p.物料编码"
    连接顺序: [供应商, 物料]
    维度:
      供应商:
        连接: [供应商]
        选择: "s.供应商名称 AS 供应商"
        分组: "s.供应商名称"
      物料:
        连接: [物料]
        选择: "m.物料编码 AS 物料编码, m.物料名称 AS 物料名称"
        分组: "m.物料编码, m.物料名称"
      物料类别:
        连接: [物料]
        选择: "m.物料类别 AS 物料类别"
        分组: "m.物料类别"
      供应商类别:
        连接: [供应商]
        选择: "s.供应商类别 AS 供应商类别"
        分组: "s.供应商类别"
      月份:
        连接: []
        选择: "substr(p.下单日期, 1, 7) AS 月份"
        分组: "substr(p.下单日期, 1, 7)"
    时间字段: "p.下单日期"
    过滤字段:
      供应商名称: {连接: [供应商], 表达式: "s.供应商名称"}
      供应商编码: {连接: [], 表达式: "p.供应商编码"}
      物料编码: {连接: [物料], 表达式: "m.物料编码"}
      物料类别: {连接: [物料], 表达式: "m.物料类别"}
    默认排序: {按: 度量, 方向: 降序}
    护栏:
      - 分母口径：按「下单日期」而非「到料日期」 —— 采购金额看的是下单行为
      - 与 M1/M2 并列使用时要说明时间字段不同（下单 vs 到料），否则对不上账

# ============================================================================
# 二、基础查询（非指标：实体计数 / 枚举 / 原子度量）
#     这类问题没有「口径」争议，但也要有确定模板，否则模型照样写错
# ============================================================================
基础查询:
  计数:
    供应商: {表: 供应商, 主键: 供应商编码}
    物料: {表: 物料, 主键: 物料编码}
    采购订单: {表: 采购订单, 主键: 采购订单号, 时间字段: 下单日期}
    到料检验: {表: 到料检验, 主键: 检验单号, 时间字段: 到料日期}
    库存记录: {表: 库存, 主键: [物料编码, 仓库名称, 批次号]}
