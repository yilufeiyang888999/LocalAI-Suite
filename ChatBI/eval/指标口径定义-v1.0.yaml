# ============================================================================
# 三、关联口径（跨表 / 多跳，语义层最容易含糊的地方，必须显式定义）
# ============================================================================
关联口径:
  主要供应商:
    含义: 某物料在指定周期内采购金额最大的供应商
    取法: 按 (物料编码, 供应商编码) 汇总 采购订单.订单金额，每物料取第 1 名
    歧义提示: 也可定义为「供货数量最大」或「最近一次供货方」——
              这是**业务决策**，v1.0 采用「采购金额最大」，客户可改
  最近一次供货:
    含义: 某物料在到料检验里到料日期最新的一条对应的供应商
    用途: 追问「现在是谁在供这个料」时的口径，与「主要供应商」可能不同
  已到料订单:
    含义: 采购订单号在 到料检验 里出现过的订单
    实证: 696 张订单中 585 张已到料，111 张未到料

  场景模板:      # 多跳查询的固定骨架，{时间} 由时间表达式填充
    C11_主要供应商不良率超标:
      用途: "哪些物料的主要供应商不良率超过阈值"
      参数: {阈值: 5, 时间: "2026-08"}
      模板: |
        WITH 主供 AS (
          SELECT 物料编码, 供应商编码,
                 ROW_NUMBER() OVER (PARTITION BY 物料编码 ORDER BY SUM(订单金额) DESC) AS 名次
          FROM 采购订单 GROUP BY 物料编码, 供应商编码
        ),
        不良 AS (
          SELECT 供应商编码, SUM(不良数量) * 100.0 / NULLIF(SUM(抽检数量), 0) AS 不良率
          FROM 到料检验 WHERE {时间} GROUP BY 供应商编码
        )
        SELECT m.物料编码, m.物料名称, s.供应商名称, ROUND(b.不良率, 2) AS 不良率
        FROM 主供 z
        JOIN 物料 m ON m.物料编码 = z.物料编码
        JOIN 供应商 s ON s.供应商编码 = z.供应商编码
        JOIN 不良 b ON b.供应商编码 = z.供应商编码
        WHERE z.名次 = 1 AND b.不良率 > {阈值}
        ORDER BY m.物料编码
    C12_最高不良供应商所供物料:
      用途: "不良率最高的供应商主要供应哪些物料（下钻）"
      参数: {时间: "2026-08"}
      # 🔴 适用门槛（2026-10-17 补，直接由实测失败逼出来的）：
      #    C12 的名字里带「不良率最高」，于是「上月不良率最高的供应商是哪家」这类问句
      #    在**字面上**和它很像，模型就套了 C12 → 输出的全是物料列，恰恰缺了用户要的
      #    「供应商」那一列。实测（多问法题集 M01/M02/M04/M05，四种说法全中）：
      #    5 种问法里 4 种塌到同一个错法，是**场景匹配的优先级问题**，不是模型随机波动。
      #    判据是字面的：问句没提「物料」就不该走「下钻到物料」这条路。
      #    —— 能规则化的别塞提示词（v6 塞提示词 −13.0pp 的教训）。
      必须含: [物料, 料号, 品号, 零件, 部件, 哪些料, 什么料, 供什么, 供哪些, 供应哪些]
      不满足时改判:
        指标: 来料不良率
        维度: [供应商]
        排序: {按: 度量, 方向: 降序}
        限制词: [第一, 冠军, 最高, 最差, 最搞, 最大, 最严重, 哪家, 哪个, 谁]
        说明: 问句里没有「物料」，不属于「下钻到物料」，按指标类「来料不良率 + 维度 供应商」理解
      模板: |
        WITH 最高 AS (
          SELECT 供应商编码 FROM 到料检验 WHERE {时间}
          GROUP BY 供应商编码
          ORDER BY SUM(不良数量) * 100.0 / NULLIF(SUM(抽检数量), 0) DESC LIMIT 1
        )
        SELECT DISTINCT m.物料编码, m.物料名称, m.物料类别
        FROM 最高 h
        JOIN 采购订单 p ON p.供应商编码 = h.供应商编码
        JOIN 物料 m ON m.物料编码 = p.物料编码
        ORDER BY m.物料编码
    C13_低库存物料的供应商:
      用途: "库存低于安全库存的物料分别由哪家供应商供货（下钻）"
      参数: {}
      模板: |
        WITH 低库存 AS (
          SELECT m.物料编码 FROM 库存 k JOIN 物料 m ON m.物料编码 = k.物料编码
          GROUP BY m.物料编码 HAVING SUM(k.库存数量) < MAX(m.安全库存)
        )
        SELECT DISTINCT m.物料编码, m.物料名称, s.供应商名称
        FROM 低库存 z
        JOIN 物料 m ON m.物料编码 = z.物料编码
        JOIN 采购订单 p ON p.物料编码 = z.物料编码
        JOIN 供应商 s ON s.供应商编码 = p.供应商编码
        ORDER BY m.物料编码, s.供应商名称

# ============================================================================
# 四、实体别名映射（治「东莞精诚」≠「东莞精诚五金制品有限公司」）
# ============================================================================
实体别名:
  匹配策略:
    默认: 模糊包含
    依据: 客户口语名通常是库内全称的子串（包 0 实证：B07 精确匹配返回 0 行，不报错）
    规范化:
      - 去后缀: [股份有限公司, 有限责任公司, 有限公司, 制品厂, 科技公司, 公司, 厂]
      - 去空白、统一全半角
    唯一性: 模糊命中 >1 条时**不得任选**，必须把候选返回给用户澄清
    兜底: 命中 0 条时**先按「去地名前缀」重试一次**（见下），仍 0 条才明说「库里没有匹配」，不猜、不退回全表
    # 🔴 这一条是「不猜」的**限定例外**，不是取消「不猜」（2026-10-17 M12）。
    #    起因：模型把用户说的「恒力」补成「东莞恒力」，库里是「宁波恒力精密铸造有限公司」
    #    → 0 命中 → 明明能答的题被回成「库里没有这家供应商」。
    #    为什么修在这里而不是提示词：诱导源是提示词里的示例（示例即模板），
    #    但删示例会让 7B 整体变保守（60 题 −3、硬答 +2，已实测）——
    #    反复调措辞只是「按下葫芦浮起瓢」。匹配层的规则是确定性的，能定死。
    #    ⚠️ 它是**窄口子**：只在 0 命中时开，且下面每个条件都是硬条件。
    去地名前缀:
      触发: 仅当第一次模糊命中**恰好 0 条**（命中 1 条直接用；>1 条走澄清，绝不重试）
      做法: 去掉值开头 2~3 字（城市/地名）后按同样方式再查一次
      残值下限: 剥完至少剩 2 字（否则「东莞精诚」剥成「诚」，什么都能命中）
      采纳条件: 唯一命中即采纳；剥 2 字就命中多条 ⇒ **出候选让人选**，不猜、也不再继续往宽里剥
        # 不写「剥 2 字与剥 3 字指向不同实体就不采纳」那种判据 —— 在当前
        # LIKE 语义下它永不触发（剥 3 字的候选集必然包含剥 2 字的），
        # 一条永不触发的判据不是保障。这里改成能实际生效的单向规则。
      记录: 采纳时必须在提示里写明「原值 → 剥掉的字 → 命中全称」，**不许静默改写**
      失败即失败: 重试后仍 0 条 ⇒ 照原话说「库里没有匹配」；命中多条 ⇒ 出候选澄清（**不许说成「不存在」**）
  实体:
    供应商:
      表: 供应商
      匹配字段: 供应商名称
      主键: 供应商编码
      别称: [供应商, 厂商, 供货商, 厂家, 供方, 对方, 卖家]
    物料:
      表: 物料
      匹配字段: 物料名称
      主键: 物料编码
      别称: [物料, 零件, 部件, 料号, 品号, 货品, 材料]
    仓库:
      表: 库存
      匹配字段: 仓库名称
      主键: [物料编码, 仓库名称, 批次号]
      别称: [仓库, 仓, 库房, 仓位, 库存]
  表别名:
    质检记录: 到料检验
    质检: 到料检验
    检验: 到料检验
    来料检验: 到料检验
    验货: 到料检验
    采购单: 采购订单
    订单: 采购订单
    工单: 生产工单
    生产计划: 生产工单

