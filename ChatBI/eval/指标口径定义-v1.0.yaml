# 五、时间表达式映射（治「上月」被算成 2026-05）
#     规则 + 锚点 → 确定区间，渲染时从 时间锚点 推算；本文件不存展开后的日期
# ============================================================================
时间表达式:
  窗口定义:
    # 类型=月窗口: 以锚点所在月为 0，[所在月+起, 所在月+止)；起=-1,止=0 即「上月」
    本月: {类型: 月窗口, 起: 0, 止: 1}
    上月: {类型: 月窗口, 起: -1, 止: 0}
    上个月: {同: 上月}
    这个月: {同: 本月}
    近两个月: {类型: 月窗口, 起: -1, 止: 1}
    近三个月: {类型: 月窗口, 起: -2, 止: 1}
    近半年: {类型: 月窗口, 起: -5, 止: 1}
    近六个月: {同: 近半年}
    近6个月: {同: 近半年}
    本季度: {类型: 季窗口, 起: 0, 止: 1}
    上一季度: {类型: 季窗口, 起: -1, 止: 0}
    今年: {类型: 年窗口, 起: 0, 止: 1}
    去年: {类型: 年窗口, 起: -1, 止: 0}
    近30天: {类型: 日窗口, 起: -29, 止: 1}
    全部: {类型: 全区间}
  指定日期:
    月份: {格式: ["YYYY年M月", "YYYY-MM", "YYYY/M"], 展开为: "[当月1日, 次月1日)"}
    季度: {格式: ["YYYY年Qn", "YYYYQn"], 展开为: "[当季首日, 次季首日)"}
  说明:
    - 比较一律用「左闭右开」区间（>= 起 AND < 止），避免月末遗漏
    - 日期在库里是 'YYYY-MM-DD' 文本，字典序与时间序一致，可直接字符串比较
    - 「近N个月」按**自然月**粒度（不是滚动 N×30 天）——
