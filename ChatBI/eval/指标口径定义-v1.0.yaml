# ============================================================================
# ChatBI 语义层 · 指标口径定义 v1.0
# ----------------------------------------------------------------------------
# 定位：这是「数字怎么算」的书面约定，是模型与数据库之间的唯一中介。
#      模型只负责把自然语言变成「指标 + 维度 + 过滤 + 时间 + 排序」，
#      SQL 一律由本文件的结构化定义拼出 —— 模型不碰 SQL 语法，也不碰口径。
#
# 为什么这么做（有实测依据，不是设计洁癖）：
#   包 0 摸底：本地 4B 模型裸直出 SQL，20 题只过 9 题（45%）。
#   11 次失败里 9 次是语义层能根除的：
#     口径错 3（对行比率求平均 / 单仓比较 / 拿下单日当到料日）
#     语法错 3（缺表前缀 → ambiguous column）
#     时间口径错 1（把「上月」算成 2026-05）
#     实体名精确匹配 1（「东莞精诚」≠ 库内全称 → 静默 0 行）
#   详见 eval/摸底报告.md。
#
# 单一事实来源声明：
#   本文件是口径的唯一来源。校准基准（口径验证.py、题集标准 SQL）只用于
#   「对账」，不得反向写回本文件。校验见 scripts/校验-语义层.py。
#
# 拼装规则（渲染器 scripts/语义层.py 按此确定性拼装，本文件不存成品 SQL，
#          避免「同一件事两处定义」）：
#   {选择} = 维度.选择表达式 [,...] + 度量表达式 AS 度量别名
#   {连接} = 所需维度/过滤字段所声明的连接，按「连接顺序」去重拼接
#   {条件} = 时间谓词 AND 过滤谓词 [AND ...]（无则省略 WHERE）
#   {分组} = GROUP BY 维度.分组表达式 [,...]（无维度则省略）
#   {排序} = ORDER BY 度量别名|维度表达式 方向（默认取指标.默认排序）
#   {限制} = LIMIT n（0 表示不限）
# ============================================================================

版本: "1.0"
状态: 定稿（取代 v0.1 草案）
生成日: "2026-10-12"
上游依据: [资产-制造业Demo库/指标口径-草案.yaml, 资产-制造业Demo库/口径验证.py, eval/摸底报告.md]

